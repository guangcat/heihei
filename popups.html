<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<!-- 脚本活着的第一件事：给 <html> 打上 js 标记。下面那个 .needjs 兜底提示
     默认是显示的，脚本一跑起来就把它藏掉。这样"脚本不执行"的环境（微信里
     直接点开 html 文件、iOS 快速查看）会看到一句人话，而不是一个按不动的按钮；
     而正常浏览器里它连闪都不会闪一下。 -->
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>致温柔的你</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1830'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%238fb6f0'%3E%E9%9B%A8%3C/text%3E%3C/svg%3E">
<!--
  版本 2：满屏飘窗版
  模仿的是"Python tkinter 满屏弹窗"那种效果，但在网页里做，
  所以手机（iPhone）也能跑。窗口是页面内的卡片，不是操作系统窗口。
  骨架同样来自 abandon888/HappyBirthday (MIT)，署名与许可见 NOTICE.md。
-->
<style>
/* ============================================================
   雨夜祝福页 · 满屏飘窗版 样式
   和雨夜版共用背景/音频/收尾，只有"第二幕"换成了满屏飘窗。
   ============================================================ */

html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --page-background: #070c16;
  --text-color: #eaf0f8;
  --dim-color: rgba(234, 240, 248, 0.6);
  --accent-color: #8fb6f0;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--page-background);
}

body {
  width: 100vw;
  color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}

/* ---------- 背景 ---------- */
#sky {
  position: fixed; inset: 0;
  background: radial-gradient(130% 90% at 50% -10%, #1b3358 0%, #0d1830 42%, #070c16 100%);
}

#glow {
  position: fixed; left: 50%; bottom: -18vh;
  width: 140vw; height: 46vh; transform: translateX(-50%);
  pointer-events: none;
  background: radial-gradient(50% 60% at 50% 100%, rgba(255, 196, 128, 0.2), rgba(255, 196, 128, 0) 70%);
}

canvas {
  position: fixed; inset: 0;
  display: block; width: 100%; height: 100%;
  pointer-events: none;
}

#rain { opacity: 0.92; transition: opacity 2.2s ease; }
#stars { opacity: 0; transition: opacity 2.8s ease; }

/* ---------- 音乐开关 ---------- */
.play-pause {
  position: fixed;
  right: 5vw; top: calc(var(--safe-top) + 18px);
  width: 42px; height: 42px;
  border: 1px solid rgba(160, 195, 250, 0.28);
  border-radius: 50%;
  background: rgba(20, 32, 56, 0.5);
  color: rgba(234, 240, 248, 0.9);
  font-size: 15px; line-height: 1; font-family: inherit;
  cursor: pointer;
  z-index: 400;                 /* 永远压在最上面，飘窗盖不住它 */
  opacity: 0; pointer-events: none;
  transition: opacity 0.6s ease, background 0.3s ease;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}

.play-pause::before { content: "\266b"; display: block; font-size: 16px; }
.play-pause.playing::before { content: "\275a\275a"; font-size: 11px; letter-spacing: 1px; }
.play-pause.show { opacity: 1; pointer-events: auto; }
.play-pause.playing { background: rgba(143, 182, 240, 0.3); }
.play-pause.dim { color: rgba(234, 240, 248, 0.4); }

/* ---------- 开场 ---------- */
.startSign {
  position: fixed; inset: 0; z-index: 500;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  gap: 4px; padding: 0 30px;
  text-align: center;
  transition: opacity 0.9s ease, transform 0.9s ease;
}

.startSign.hide { opacity: 0; transform: translateY(-16px); pointer-events: none; }

.startSign .hint {
  margin: 0;
  font-size: 13.5px; line-height: 1.9; letter-spacing: 0.08em;
  color: var(--dim-color);
}

.startSign .hint.status { min-height: 1.4em; color: rgba(234, 240, 248, 0.42); }

.startSign .start-button {
  margin-top: 26px;
  padding: 0.95rem 2.9rem;
  border: 1px solid rgba(190, 215, 255, 0.36);
  border-radius: 999px;
  background: rgba(160, 195, 250, 0.12);
  font-size: 17px; letter-spacing: 0.18em; text-indent: 0.18em;
  cursor: pointer;
  font-family: inherit;                       /* <button> 不继承字体，显式写一遍 */
  -webkit-appearance: none; appearance: none;
  color: inherit;
  transition: transform 0.18s ease, background 0.3s ease;
}

.startSign .start-button:active { transform: scale(0.96); background: rgba(160, 195, 250, 0.26); }

/* ---------- 舞台 ---------- */
.container {
  position: fixed; inset: 0;
  overflow: hidden;
  z-index: 100;
  pointer-events: none;   /* 需要点击的子元素自己打开 */
}

.scene {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 30px;
  text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity 1s ease, transform 1s ease;
}

.scene.active { opacity: 1; pointer-events: auto; }

.one .big {
  margin: 0;
  font-size: 42px; font-weight: 500;
  letter-spacing: 0.3em; text-indent: 0.3em;
  text-shadow: 0 0 36px rgba(150, 190, 255, 0.34);
}

.one .sub {
  margin: 18px 0 0;
  font-size: 15px; letter-spacing: 0.12em;
  color: var(--dim-color);
}

/* 第二幕：飘窗区（窗口自己定位，不受 flex 约束） */
.two { justify-content: flex-start; padding: 0; }
#wins { position: absolute; inset: 0; }

/* ---------- 飘窗 ---------- */
.win {
  position: absolute;
  left: 0; top: 0;
  min-width: 118px;
  border-radius: 10px;
  background: #ffffff;
  color: #1b1e26;
  overflow: hidden;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(0, 0, 0, 0.06);
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1);
  will-change: transform, opacity;
  touch-action: none;           /* 手指拖着走，不要触发页面滚动 */
}

/* 四种很淡的底色，避免整屏死白 */
.win.t0 { background: #ffffff; }
.win.t1 { background: #fdfbf6; }
.win.t2 { background: #f6f8fd; }
.win.t3 { background: #f7fbf9; }

.win .tb {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 7px 7px 9px;
  background: linear-gradient(180deg, rgba(247, 249, 252, 0.96), rgba(238, 241, 246, 0.96));
  border-bottom: 1px solid rgba(0, 0, 0, 0.07);
}

.win .tb .ic {
  flex: 0 0 15px; width: 15px; height: 15px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  font-size: 9px; color: #fff; line-height: 1;
  background: linear-gradient(160deg, #6f9ae0, #3f5f9e);
}

.win .tb .tt {
  flex: 1 1 auto; min-width: 0;
  font-size: 11.5px; letter-spacing: 0.04em; color: #5a6070;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}

.win .tb .cx {
  flex: 0 0 19px; width: 19px; height: 19px;
  border: 0; border-radius: 4px;
  background: transparent;
  color: #8a90a0; font-size: 13px; line-height: 1;
  font-family: inherit; cursor: pointer;
}

.win .tb .cx:active { background: rgba(0, 0, 0, 0.08); }

.win .bd {
  padding: 13px 12px 15px;
  font-size: 13.5px; line-height: 1.55;
  text-align: center;
}

.win.dragging { transition: none; }

/* ---------- 第三幕 ---------- */
.three .type {
  margin: 0;
  min-height: 3.8em;
  font-size: 26px; line-height: 1.85;
  letter-spacing: 0.14em; text-indent: 0.14em;
  text-shadow: 0 0 30px rgba(150, 190, 255, 0.36);
}

#caret {
  display: inline-block;
  width: 1px; height: 1em; margin-left: 2px;
  background: rgba(234, 240, 248, 0.75);
  vertical-align: -0.12em;
  animation: blink 1s steps(1) infinite;
}

#caret.off { display: none; }

@keyframes blink { 50% { opacity: 0; } }

.three .credit-line {
  margin: 14px 0 0;
  font-size: 13px; letter-spacing: 0.12em;
  color: var(--dim-color);
  opacity: 0; transition: opacity 1.2s ease;
}

.three .credit-line.show { opacity: 1; }

.three .wish-btn {
  margin: 30px 0 0;
  padding: 0.9rem 2.4rem;
  border: 1px solid rgba(190, 215, 255, 0.36);
  border-radius: 999px;
  background: rgba(160, 195, 250, 0.12);
  font-size: 16px; letter-spacing: 0.16em; text-indent: 0.16em;
  cursor: pointer;
  opacity: 0; pointer-events: none;
  transition: opacity 1.2s ease, transform 0.18s ease, background 0.3s ease;
}

.three .wish-btn.show { opacity: 1; pointer-events: auto; }
.three .wish-btn:active { transform: scale(0.96); background: rgba(160, 195, 250, 0.26); }

.three .last-line {
  position: absolute; bottom: calc(var(--safe-bottom) + 52px);
  left: 0; right: 0; margin: 0;
  font-size: 14px; letter-spacing: 0.14em;
  color: var(--dim-color);
  opacity: 0; transition: opacity 1.6s ease;
}

.three .last-line.show { opacity: 1; }

/* ---------- 底部按钮条 ---------- */
.footbar {
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--safe-bottom) + 14px);
  display: flex; justify-content: center; gap: 10px;
  z-index: 300;                 /* 压住飘窗 */
  opacity: 0; pointer-events: none;
  transition: opacity 0.9s ease;
}

.footbar.show { opacity: 1; pointer-events: auto; }

.foot-btn {
  padding: 9px 16px;
  border: 1px solid rgba(160, 195, 250, 0.18);
  border-radius: 999px;
  background: rgba(20, 32, 56, 0.82);
  font-size: 13px; letter-spacing: 0.06em;
  color: rgba(234, 240, 248, 0.82);
  cursor: pointer;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}

/* ---------- 抽屉 ---------- */
.drawer {
  position: fixed; inset: 0; z-index: 600;
  padding: calc(var(--safe-top) + 44px) 26px calc(var(--safe-bottom) + 44px);
  background: linear-gradient(180deg, rgba(7, 12, 22, 0.97), rgba(7, 12, 22, 0.995));
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  text-align: left;
  opacity: 0; pointer-events: none;
  transform: translateY(14px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}

.drawer.show { opacity: 1; pointer-events: auto; transform: none; }

.drawer h2 { margin: 0 0 20px; font-size: 19px; font-weight: 500; letter-spacing: 0.14em; }
.drawer ul { margin: 0; padding: 0; list-style: none; }
.drawer li { font-size: 16px; line-height: 1.95; letter-spacing: 0.02em; color: rgba(234, 240, 248, 0.86); }
.drawer hr { margin: 26px 0; border: 0; border-top: 1px solid rgba(160, 195, 250, 0.16); }

.drawer .sub-label {
  margin: 0 0 10px;
  font-size: 12px; letter-spacing: 0.16em;
  color: var(--dim-color);
}

.drawer .close-btn {
  display: inline-block;
  margin-top: 30px;
  padding: 0.85rem 2.4rem;
  border: 1px solid rgba(190, 215, 255, 0.36);
  border-radius: 999px;
  font-size: 16px; letter-spacing: 0.16em; text-indent: 0.16em;
  text-align: center;
  cursor: pointer;
}

/* ---------- 落星 ---------- */
.starfall {
  position: fixed; top: -8vh; z-index: 55;
  font-size: 16px;
  color: rgba(220, 235, 255, 0.9);
  text-shadow: 0 0 10px rgba(170, 205, 255, 0.8);
  pointer-events: none;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: translateY(112vh) rotate(220deg); opacity: 0; }
}

/* ---------- 小屏 ---------- */
/* ---------- 没有脚本在跑时的兜底 ----------
   默认显示；脚本一跑起来会给 <html> 加 .js，这里就把它藏掉。
   微信里直接点开 html 文件、iOS 的快速查看，都是"样式渲染、脚本不执行"，
   在那种环境里 <noscript> 不算数，所以要用这个办法。 */
.needjs {
  position: fixed; inset: 0; z-index: 900;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; padding: 0 30px;
  text-align: center;
  background: var(--page-background);
}

html.js .needjs { display: none; }

.needjs-t { margin: 0; font-size: 20px; letter-spacing: 0.12em; }

.needjs-d {
  margin: 0;
  font-size: 13.5px; line-height: 2;
  color: var(--dim-color);
}

.needjs-d b { color: rgba(234, 240, 248, 0.92); font-weight: 600; letter-spacing: 0.04em; }

.needjs-list { margin: 22px 0 0; padding: 0; list-style: none; }

.needjs-list li {
  font-size: 15px; line-height: 2.1;
  color: rgba(234, 240, 248, 0.82);
}

@media screen and (max-width: 420px) {
  .one .big { font-size: 36px; letter-spacing: 0.24em; text-indent: 0.24em; }
  .three .type { font-size: 22px; }
  .win .bd { font-size: 13px; }
}

@media screen and (prefers-reduced-motion: reduce) {
  .starfall { animation-duration: 4s; }
  .win { transition-duration: 0.2s; }
}

</style>
</head>
<body>

<div id="sky"></div>
<div id="glow"></div>
<canvas id="stars"></canvas>
<canvas id="rain"></canvas>

<button id="playPauseButton" class="play-pause" aria-label="播放或暂停音乐"></button>

<div class="startSign" id="startSign">
  <p class="hint" data-node-name="hint">戴上耳机，或者把声音开一点点</p>
  <p class="hint status" data-status aria-live="polite"></p>
  <button type="button" id="startButton" class="start-button" data-node-name="startButtonLabel">好</button>
</div>

<div class="container" id="container">

  <!-- 第一幕：天黑黑 -->
  <div class="scene one" id="scene1">
    <h1 class="big" data-node-name="line1">天黑黑</h1>
    <p class="sub" data-node-name="line1Sub">下雨了，坐一会儿</p>
  </div>

  <!-- 第二幕：满屏飘窗 -->
  <div class="scene two" id="scene2">
    <div id="wins"></div>
  </div>

  <!-- 第三幕：收尾 -->
  <div class="scene three" id="scene3">
    <p class="type"><span id="typed"></span><span id="caret" class="off"></span></p>
    <p class="credit-line" id="credit" data-node-name="credit">孙燕姿《天黑黑》</p>
    <p class="wish-btn" id="wish" data-node-name="wishLabel">愿你往后顺遂</p>
    <p class="last-line" id="last" data-node-name="lastLine">晚安，记得吃饭。</p>
  </div>

  <div class="footbar" id="footbar">
    <span class="foot-btn" id="more" data-node-name="moreLabel">还有几句</span>
    <span class="foot-btn" id="replay" data-node-name="replayText">再看一遍</span>
  </div>

  <div class="drawer" id="drawer">
    <h2 data-node-name="drawerTitle">还有几句</h2>
    <ul id="drawerList"></ul>
    <hr>
    <p class="sub-label" data-node-name="rememberLabel">记在心上</p>
    <ul id="rememberList"></ul>
    <p class="close-btn" id="close">收好</p>
    <!--
      MIT 署名。按你的要求不再显示在页面上，但 MIT 许可证要求这份声明随代码一起保留，
      所以放在这里（完整许可证原文见 NOTICE.md，仓库里那份也保留着）：
      页面骨架来自 abandon888/HappyBirthday（https://github.com/abandon888/HappyBirthday）
      与上游 faahim/happy-birthday（https://github.com/faahim/happy-birthday），MIT 协议；
      由本页作者改写为雨夜祝福版。窗口可以拖动，也可以按 × 关掉。
    -->
  </div>

</div>

<!-- 没有脚本在跑时的兜底。默认显示，脚本一跑起来（给 html 加上 .js）就隐藏。
     比 <noscript> 管用：微信的文件预览、iOS 的快速查看属于"样式照渲染、
     脚本一句不执行"，在那种环境里连 <noscript> 都不算数。 -->
<div class="needjs">
  <p class="needjs-t">这个页面要在浏览器里打开</p>
  <p class="needjs-d">
    你现在这个环境不执行网页里的脚本，所以按「好」不会有反应。<br>
    把下面这个地址复制到 Safari（或者手机自带的浏览器）打开就行：
  </p>
  <p class="needjs-d"><b>guangcat.github.io/heihei</b></p>
  <ul class="needjs-list">
    <li>愿你三餐按时，夜里好眠。</li>
    <li>天黑有灯，下雨有伞，往后的路都是好天气。</li>
    <li>你值得所有的美好。</li>
  </ul>
</div>

<script>
/* ============================================================
   雨夜祝福页 · 满屏飘窗版 脚本

   第二幕换成"满屏飘窗"：一条条小窗口随机位置、随机大小地冒出来，
   能拖、能按 × 关掉、也会自己过一会儿消失——模仿那类
   "Python tkinter 满屏弹窗"视频的效果，但跑在浏览器里，所以手机能用。

   骨架沿用 abandon888/HappyBirthday (MIT)，署名见 NOTICE.md。
   ============================================================ */

(function () {
  'use strict';

  /* ================= 1. 所有能改的东西都在这里 ================= */
  var CONFIG = {
    /* 音频：文件放进 music 文件夹就自动生效 */
    music: 'music/天黑黑.mp3',        // 这首歌。页面里唯一的音频，没有别的垫底音了
    musicVolume: 1.0,

    /* 想让"点一下"顺带唤起 Apple Music 就用它（默认关着，见下面的开关） */
    appleMusic: 'https://music.apple.com/cn/search?term=' + encodeURIComponent('天黑黑 孙燕姿'),

    /* 点"好"时是否顺带唤起 Apple Music（iOS 不允许页面自己跳，放进"点一下"才可以） */
    jumpToAppleMusicOnStart: false,

    /* ---- 满屏飘窗的参数（变量名沿用那类视频里的写法） ----
       注意：视频里是桌面程序开真窗口，POPUP_COUNT 能到 800。
       网页里每个窗口都是一个 DOM 元素，手机扛不住那么多，
       所以靠 MAX_ALIVE 限制"同时在屏幕上活着的窗口数"，超了就挤掉最早的。
       想让屏幕上更挤：把 MAX_ALIVE 调大、POPUP_DURATION_MAX 调大。 */
    POPUP_COUNT: 180,           // 一轮总共弹多少个（一轮弹完会自动接着下一轮）
    GENERATE_INTERVAL: 165,     // 每多少个毫秒弹一个
    POPUP_DURATION_MIN: 4200,   // 每个窗口最短活多久（毫秒）
    POPUP_DURATION_MAX: 8000,   // 最长活多久
    MAX_ALIVE: 52,              // 屏幕上最多同时几个（窗口多了，阴影已经调轻）
    TAIL_HOLD: 2200,            // 弹完之后停多久进收尾
    autoLoopAfter: 12000,       // 收尾之后停多久，自动无声无息地再放一遍

    /* ---- 文字 ---- */
    hint: '戴上耳机，或者把声音开一点点',
    startButtonLabel: '好',
    line1: '天黑黑',
    line1Sub: '下雨了，坐一会儿',
    typeLine: '下起雨也要勇敢前进',
    credit: '孙燕姿《天黑黑》',
    wishLabel: '愿你往后顺遂',
    lastLine: '晚安，记得吃饭。',
    moreLabel: '还有几句',
    replayText: '再来一次',
    drawerTitle: '还有几句',
    rememberLabel: '记在心上',

    /* ---- 飘窗的内容（标题栏是"话题"，正文是祝福） ----
       想加就照格式往下写；没有任何恋爱元素。 */
    POPUPS: [

  /* ================= 2. 小工具 ================= */
  var $ = function (id) { return document.getElementById(id); };

  function setText(nodeName, value) {
    var node = document.querySelector('[data-node-name="' + nodeName + '"]');
    if (node && value) node.textContent = value;
  }

  function setStatus(message) {
    var node = document.querySelector('[data-status]');
    if (node) node.textContent = message || '';
  }

  function rand(min, max) { return min + Math.random() * (max - min); }

  function applyConfig() {
    ['hint', 'startButtonLabel', 'line1', 'line1Sub', 'credit', 'wishLabel',
     'lastLine', 'moreLabel', 'replayText', 'drawerTitle', 'rememberLabel']
      .forEach(function (key) { setText(key, CONFIG[key]); });

    var dl = $('drawerList');
    CONFIG.drawer.forEach(function (line) {
      var li = document.createElement('li');
      li.textContent = line;
      dl.appendChild(li);
    });

    var rl = $('rememberList');
    CONFIG.remember.forEach(function (line) {
      var li = document.createElement('li');
      li.textContent = line;
      rl.appendChild(li);
    });

  }

  /* ================= 3. 雨和星（canvas） ================= */
  var rainCv = $('rain'), starCv = $('stars');
  var rctx = rainCv.getContext('2d'), sctx = starCv.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    [[rainCv, rctx], [starCv, sctx]].forEach(function (pair) {
      pair[0].width = Math.floor(W * DPR);
      pair[0].height = Math.floor(H * DPR);
      pair[1].setTransform(DPR, 0, 0, DPR, 0, 0);
    });
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 320); });
  resize();

  var MAX_DROPS = reduced ? 70 : 220;
  var intensity = 0.34;
  var rainFade = 1;
  var starFade = 0;
  var drops = [];

  function newDrop(fromTop) {
    return {
      x: Math.random() * (W + 140) - 70,
      y: fromTop ? -Math.random() * H * 0.7 : Math.random() * H,
      len: 9 + Math.random() * 20,
      vy: 5.5 + Math.random() * 7,
      vx: -0.9 - Math.random() * 0.8,
      a: 0.10 + Math.random() * 0.34,
      w: Math.random() < 0.22 ? 1.6 : 1
    };
  }
  for (var i = 0; i < MAX_DROPS; i++) drops.push(newDrop(false));

  var stars = [];
  var STAR_COUNT = reduced ? 40 : 110;
  for (var j = 0; j < STAR_COUNT; j++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.78,
      r: 0.5 + Math.random() * 1.5,
      p: Math.random() * Math.PI * 2,
      sp: 0.012 + Math.random() * 0.022,
      a: 0.25 + Math.random() * 0.6
    });
  }

  var lastTime = 0;
  function frame(t) {
    var dt = lastTime ? Math.min((t - lastTime) / 16.67, 3) : 1;
    lastTime = t;

    if (rainFade > 0) {
      rctx.clearRect(0, 0, W, H);
      rctx.lineCap = 'round';
      var active = Math.round(MAX_DROPS * intensity * rainFade);
      for (var a = 0; a < active; a++) {
        var d = drops[a];
        rctx.beginPath();
        rctx.strokeStyle = 'rgba(190,215,250,' + d.a + ')';
        rctx.lineWidth = d.w;
        rctx.moveTo(d.x, d.y);
        rctx.lineTo(d.x + d.vx * d.len / 14, d.y + d.len);
        rctx.stroke();
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        if (d.y > H + 24) drops[a] = newDrop(true);
        if (d.x < -80) d.x = W + 60;
      }
    }

    if (starFade > 0) {
      sctx.clearRect(0, 0, W, H);
      for (var b = 0; b < stars.length; b++) {
        var s = stars[b];
        s.p += s.sp * dt;
        var tw = 0.55 + 0.45 * Math.sin(s.p);
        sctx.beginPath();
        sctx.fillStyle = 'rgba(226,238,255,' + (s.a * tw * starFade) + ')';
        sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        sctx.fill();
      }
    }
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);

  /* ================= 4. 音乐 ================= */
  var song = new Audio();
  // 文件名不一定完全一样，所以依次试几个常见位置，谁能取到就播谁：
  //   1. music/天黑黑.mp3（页面旁边的那份；打包成单文件时这里会被替换成内嵌音频）
  //   2. 天黑黑.mp3（有人习惯把 mp3 和 html 放同一层）
  var SONG_SRC = [CONFIG.music, '天黑黑.mp3'];
  var songIndex = 0;
  var wantPlay = false;        // 她点过「好」、而且没按暂停：想让歌响
  // preload 用 auto：页面一打开就开始缓冲这首歌，点下去才来得及出声。
  song.loop = true; song.preload = 'auto'; song.src = SONG_SRC[0]; song.volume = CONFIG.musicVolume;

  var songReady = false, isPlaying = false;
  var playPauseButton = $('playPauseButton');

  function updatePlayButton() {
    // 开场页只有"一行字 + 一个「好」"：这个开关要等她点过之后才露出来
    if (started) playPauseButton.classList.add('show');
    playPauseButton.classList.toggle('playing', isPlaying);
    playPauseButton.classList.toggle('dim', !isPlaying);
  }

  song.addEventListener('playing', function () {
    isPlaying = true;
    updatePlayButton();
  });

  song.addEventListener('canplaythrough', function () {
    songReady = true;
    updatePlayButton();
  });
  song.addEventListener('error', function () {
    songReady = false;

    // 这个位置取不到，就试下一个
    if (songIndex + 1 < SONG_SRC.length) {
      songIndex++;
      song.src = SONG_SRC[songIndex];
      song.load();
      if (wantPlay) { var p = song.play(); if (p && p.catch) p.catch(function () {}); }
      return;
    }

    // 全试完了：页面就是安静的，不摆任何跳转按钮。
    isPlaying = false;
    updatePlayButton();
    if (window.location.search.indexOf('debug') >= 0) {
      setStatus('没找到音频文件，页面是静音的。');
    } else {
      console.warn('没找到音频文件，页面静音。');
    }
  });
  song.load();

  function playAll() {
    // 关键：不管歌有没有缓冲好，都在"她点的那一下"里直接叫它播。
    // iOS 只肯在用户手势里让媒体开始下载和播放（preload=auto 在蜂窝网络下会被忽略），
    // 写成"等缓冲好才播"，在手机上就等于永远不播。
    // 数据还没到也没关系：这个 promise 会在真能出声的时候才 resolve。
    wantPlay = true;
    var sp = song.play();
    isPlaying = true;
    updatePlayButton();
    if (sp && sp.catch) {
      sp.catch(function () {
        // 放不了（没这个文件 / 网络不行）：按钮回到"暂停"。页面上不摆跳转按钮，
        // 所以这里就是安静地认了。
        isPlaying = false;
        updatePlayButton();
      });
    }
  }

  function togglePlay(play) {
    if (play) { playAll(); return; }
    wantPlay = false;
    song.pause();
    isPlaying = false;
    updatePlayButton();
  }

  playPauseButton.addEventListener('click', function (ev) {
    ev.stopPropagation();
    togglePlay(!isPlaying);
  });

  /* ================= 5. 分幕 ================= */
  var scene1 = $('scene1'), scene2 = $('scene2'), scene3 = $('scene3');
  var startSign = $('startSign'), footbar = $('footbar');
  var started = false;

  function show(el, on) { el.classList.toggle('active', on); }

  /* ---------- 第二幕：满屏飘窗 ---------- */
  var winsBox = $('wins');
  var alive = [];
  var spawned = 0;
  var spawnTimer = null;
  var loopTimer = null;
  var zTop = 200;
  var deck = [];              // 洗好的牌堆，避免同一句话反复出现

  // 发牌：洗完一轮再洗下一轮，并且尽量避开屏幕上还留着的那几句
  function nextPopup() {
    if (!deck.length) {
      deck = CONFIG.POPUPS.slice();
      for (var i = deck.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
      }
    }
    var aliveMsgs = alive.map(function (x) { return x.msg; });
    for (var k = 0; k < deck.length; k++) {
      if (aliveMsgs.indexOf(deck[k].msg) < 0) return deck.splice(k, 1)[0];
    }
    return deck.pop() || CONFIG.POPUPS[0];
  }

  function closeWin(item, fast) {
    if (item.closed) return;
    item.closed = true;
    if (item.timer) clearTimeout(item.timer);
    item.el.style.opacity = '0';
    item.el.style.transform = item.base + ' scale(.86)';
    var delay = fast ? 140 : 520;
    setTimeout(function () {
      if (item.el.parentNode) item.el.parentNode.removeChild(item.el);
    }, delay);
    alive = alive.filter(function (x) { return x !== item; });
  }

  // 手指按住可以把窗口拖走
  function bindDrag(el, item) {
    var sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;

    el.addEventListener('pointerdown', function (ev) {
      if (ev.target.closest && ev.target.closest('.cx')) return;
      dragging = true;
      el.classList.add('dragging');
      item.el.style.zIndex = String(++zTop);
      sx = ev.clientX; sy = ev.clientY;
      ox = parseFloat(el.style.left) || 0;
      oy = parseFloat(el.style.top) || 0;
      if (el.setPointerCapture) { try { el.setPointerCapture(ev.pointerId); } catch (e) {} }
      ev.stopPropagation();
    });

    el.addEventListener('pointermove', function (ev) {
      if (!dragging) return;
      el.style.left = Math.round(ox + ev.clientX - sx) + 'px';
      el.style.top = Math.round(oy + ev.clientY - sy) + 'px';
    });

    function end() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  function spawn() {
    if (spawned >= CONFIG.POPUP_COUNT) return false;

    // 屏幕上太多了就把最早的那个挤掉，保住流畅
    if (alive.length >= CONFIG.MAX_ALIVE) closeWin(alive[0], true);

    var data = nextPopup();
    var el = document.createElement('div');
    el.className = 'win t' + Math.floor(Math.random() * 4);
    el.innerHTML =
      '<div class="tb">' +
        '<span class="ic">' + data.ico + '</span>' +
        '<span class="tt">' + data.ti + '</span>' +
        '<button class="cx" aria-label="关闭">\u00d7</button>' +
      '</div>' +
      '<div class="bd">' + data.msg + '</div>';
    el.style.width = Math.round(rand(118, 190)) + 'px';
    el.style.left = '-9999px';
    el.style.top = '0';
    el.style.opacity = '0';
    el.style.zIndex = String(++zTop);
    winsBox.appendChild(el);

    // 先量出真实尺寸（offsetWidth/Height 不受 transform 影响），再决定放哪儿，
    // 留 8px 边距，免得窗口贴着屏幕边被切掉一条
    var w = el.offsetWidth, h = el.offsetHeight;
    var PAD = 8;
    var x = rand(PAD, Math.max(PAD, W - w - PAD));
    var y = rand(PAD, Math.max(PAD, H - h - PAD));
    var rot = rand(-3.5, 3.5).toFixed(2);
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(y) + 'px';

    var item = { el: el, msg: data.msg, base: 'rotate(' + rot + 'deg)', closed: false, timer: null };
    alive.push(item);

    // 入场：从略小、略歪变正
    el.style.transform = item.base + ' scale(.84)';
    setTimeout(function () {
      el.style.opacity = '1';
      el.style.transform = item.base + ' scale(1)';
    }, 20);

    el.querySelector('.cx').addEventListener('click', function (ev) {
      ev.stopPropagation();
      closeWin(item, false);
    });
    bindDrag(el, item);

    item.timer = setTimeout(function () {
      closeWin(item, false);
    }, rand(CONFIG.POPUP_DURATION_MIN, CONFIG.POPUP_DURATION_MAX));

    spawned++;
    return true;
  }

  function floodTick() {
    if (!spawn()) {                                  // 弹完了
      spawnTimer = setTimeout(finish, CONFIG.TAIL_HOLD);
      return;
    }
    spawnTimer = setTimeout(floodTick, CONFIG.GENERATE_INTERVAL);
  }

  function startFlood() {
    spawned = 0;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    alive.slice().forEach(function (item) { closeWin(item, true); });
    alive = [];
    winsBox.innerHTML = '';
    show(scene2, true);
    floodTick();
  }

  // 给验证脚本（和自己调试）看进度用的
  window.__floodStats = function () {
    var seen = {};
    alive.forEach(function (x) { seen[x.msg] = 1; });
    return {
      spawned: spawned,
      alive: alive.length,
      distinct: Object.keys(seen).length,
      total: CONFIG.POPUP_COUNT,
      maxAlive: CONFIG.MAX_ALIVE
    };
  };

  /* ---------- 第一幕 ---------- */
  function playScene1() {
    show(scene1, true);
    setTimeout(function () {
      show(scene1, false);
      scene1.classList.add('leaving');
      setTimeout(function () { scene1.classList.remove('leaving'); }, 1000);
      intensity = 0.8;
      startFlood();
    }, CONFIG.titleHold);
  }

  /* ---------- 第三幕 ---------- */
  function finish() {
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }

    // 飘窗一片片收掉，再露出星空
    alive.slice().forEach(function (item, k) {
      setTimeout(function () { closeWin(item, false); }, k * 55);
    });

    rainFade = 0;
    $('rain').style.opacity = '0';
    starFade = 1;
    $('stars').style.opacity = '1';

    setTimeout(function () {
      show(scene2, false);
      show(scene3, true);
      footbar.classList.add('show');
      typeWriter();
    }, 1100);
  }

  function typeWriter() {
    var typed = $('typed');
    var caret = $('caret');
    var text = CONFIG.typeLine;
    var n = 0;
    typed.textContent = '';
    caret.classList.remove('off');
    var timer = setInterval(function () {
      n++;
      typed.textContent = text.slice(0, n);
      if (n >= text.length) {
        clearInterval(timer);
        setTimeout(function () {
          caret.classList.add('off');
          $('credit').classList.add('show');
          $('wish').classList.add('show');
          autoLoop();          // 让她读完这几秒，然后自动再放一遍
        }, 520);
      }
    }, reduced ? 40 : 190);
  }

  function starRain() {
    var glyphs = ['\u2726', '\u2727', '\u273f', '\u00b7', '\u2740', '\u2729'];
    for (var k = 0; k < 46; k++) {
      (function (k) {
        setTimeout(function () {
          var el = document.createElement('div');
          el.className = 'starfall';
          el.textContent = glyphs[k % glyphs.length];
          el.style.left = (Math.random() * 96 + 2) + 'vw';
          el.style.fontSize = (11 + Math.random() * 13) + 'px';
          el.style.animationDuration = (2.6 + Math.random() * 2.6) + 's';
          document.body.appendChild(el);
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 6000);
        }, k * 90);
      })(k);
    }
  }

  /* ================= 6. 交互绑定 ================= */
  // 开场这一下：按钮上绑一份，整块开场区域也绑一份——手一抖没戳中按钮也能开始
  function beginOnce(ev) {
    if (started) return;
    if (ev && ev.target && ev.target.closest && ev.target.closest('a')) return;   // 别拦住"去 App 放歌"的链接
    started = true;

    startSign.classList.add('hide');
    playPauseButton.classList.add('show');

  // 重播：按钮和"自动再来一遍"共用这一段
  function restart() {
    if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    alive.slice().forEach(function (item) { closeWin(item, true); });
    alive = [];
    winsBox.innerHTML = '';
    rainFade = 1;
    starFade = 0;
    intensity = 0.8;
    $('rain').style.opacity = '0.92';
    $('stars').style.opacity = '0';
    $('typed').textContent = '';
    $('caret').classList.add('off');
    $('credit').classList.remove('show');
    $('wish').classList.remove('show');
    $('last').classList.remove('show');
    show(scene3, false);
    show(scene2, false);
    playScene1();
  }

  // 收尾读完之后自动再来一遍。窗口是接着往外冒的，中间没有"等内容加载"的空档，
  // 所以看上去像是一直播下去。
  function autoLoop() {
    if (loopTimer) clearTimeout(loopTimer);
    loopTimer = setTimeout(function () {
      if ($('drawer').classList.contains('show')) { autoLoop(); return; }   // 她在看抽屉，先不打扰
      restart();
    }, CONFIG.autoLoopAfter);
  }

  // 再来一次
  $('replay').addEventListener('click', function (ev) {
    ev.stopPropagation();
    restart();
  });

  /* ================= 7. 启动 ================= */
  applyConfig();
})();

</script>
</body>
</html>
